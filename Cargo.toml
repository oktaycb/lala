[package]
name = "lala"
version = "0.1.0"
edition = "2021"
description = "Lala — yerel SLM için Rust agent loop: tool calling, RAG, websearch, grammar-constrained decoding"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
lto = true
